<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audioble</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        if (typeof Tone === 'undefined') {
            document.write('<script src="Tone.js"><\/script>');
        }
    </script>

    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #1e1e1e;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 520px;
            text-align: center;
            border: 1px solid #333;
            max-height: 100%;
            overflow-y: auto;
        }

        h2 { 
            margin: 0 0 5px 0; 
            color: #4CAF50; 
            font-size: 2rem; 
            letter-spacing: 1.5px; 
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 15px;
            text-align: left;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 8px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        input[type="file"] { display: none; }
        
        .file-upload-label {
            display: inline-block;
            padding: 12px 20px;
            background: #2c2c2c;
            border: 1px solid #4CAF50;
            color: #4CAF50;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .file-upload-label:hover { background: #4CAF50; color: #121212; }

        #fileName {
            display: block;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #888;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #playBtn { background: #4CAF50; color: #111; }
        #playBtn:hover:not(:disabled) { background: #45a049; }
        
        #stopBtn { background: #d32f2f; color: white; }
        #stopBtn:hover:not(:disabled) { background: #b71c1c; }

        #exportBtn { background: #2196F3; color: white; margin-bottom: 20px; width: 100%; }
        #exportBtn:hover:not(:disabled) { background: #1976D2; }

        button:disabled { background: #444 !important; color: #777 !important; cursor: not-allowed; }

        .time-display {
            font-family: monospace;
            color: #4CAF50;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Audioble</h2>
        <div class="subtitle"></div>

        <label class="file-upload-label" for="audioUpload">📁 Select Audio / Video File</label>
        <input type="file" id="audioUpload" accept="audio/*, video/mp4, video/webm, .mp4, .m4a, .mkv">
        <span id="fileName">No file selected</span>

        <div class="btn-group">
            <button id="playBtn" disabled>▶ Play</button>
            <button id="stopBtn" disabled>⏹ Stop</button>
        </div>

        <button id="exportBtn" disabled>💾 Export Modified Audio (.wav)</button>

        <!-- Practice & Looping Group -->
        <div class="control-group">
            <label style="color: #4CAF50; font-weight: bold;">
                <span>A-B Loop Practice</span>
                <input type="checkbox" id="loopToggle" disabled>
            </label>
            <label style="margin-top: 10px;"><span>Loop Start (A)</span><span id="startDisplay" class="time-display">0:00</span></label>
            <input type="range" id="startSlider" min="0" max="100" step="0.1" value="0" disabled>
            
            <label style="margin-top: 10px;"><span>Loop End (B)</span><span id="endDisplay" class="time-display">0:00</span></label>
            <input type="range" id="endSlider" min="0" max="100" step="0.1" value="100" disabled>
        </div>

        <!-- Performance Controls -->
        <div class="control-group">
            <label><span>Tempo (Speed - No Pitch Shift)</span><span id="tempoDisplay">1.0x</span></label>
            <input type="range" id="tempoSlider" min="0.5" max="2.0" step="0.05" value="1" disabled>
            
            <label style="margin-top:15px;"><span>Key (Pitch Shift)</span><span id="pitchDisplay">0 Semitones</span></label>
            <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" disabled>
        </div>

        <!-- Effects Group -->
        <div class="control-group">
            <label><span>Reverb Space</span><span id="reverbDisplay">0%</span></label>
            <input type="range" id="reverbSlider" min="0" max="1" step="0.05" value="0" disabled>

            <label style="margin-top:15px;"><span>Lowpass Filter (Muffle)</span><span id="filterDisplay">Off</span></label>
            <input type="range" id="filterSlider" min="200" max="20000" step="100" value="20000" disabled>
        </div>
    </div>

    <script>
        let player = null;
        let pitchShift = null;
        let reverb = null;
        let filter = null;
        let audioBuffer = null;
        let trackDuration = 0;
        let isPlaying = false;

        // UI Elements
        const audioUpload = document.getElementById('audioUpload');
        const fileNameDisplay = document.getElementById('fileName');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        
        const loopToggle = document.getElementById('loopToggle');
        const startSlider = document.getElementById('startSlider');
        const endSlider = document.getElementById('endSlider');
        const startDisplay = document.getElementById('startDisplay');
        const endDisplay = document.getElementById('endDisplay');
        
        const tempoSlider = document.getElementById('tempoSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const reverbSlider = document.getElementById('reverbSlider');
        const filterSlider = document.getElementById('filterSlider');
        
        const tempoDisplay = document.getElementById('tempoDisplay');
        const pitchDisplay = document.getElementById('pitchDisplay');
        const reverbDisplay = document.getElementById('reverbDisplay');
        const filterDisplay = document.getElementById('filterDisplay');

        // 1. File Upload & Audio Graph Setup
        audioUpload.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = "Loading audio engine... Please wait.";
            toggleControls(false);
            await Tone.start();

            if (player) player.dispose();
            if (pitchShift) pitchShift.dispose();
            if (reverb) reverb.dispose();
            if (filter) filter.dispose();

            const url = URL.createObjectURL(file);

            pitchShift = new Tone.PitchShift({ pitch: 0, windowSize: 0.1 });
            filter = new Tone.Filter({ frequency: 20000, type: "lowpass" });
            reverb = new Tone.Freeverb({ roomSize: 0.8, dampening: 3000, wet: 0 });

            pitchShift.connect(filter);
            filter.connect(reverb);
            reverb.toDestination();

            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            audioBuffer = await Tone.context.decodeAudioData(arrayBuffer);
            trackDuration = audioBuffer.duration;

            fileNameDisplay.textContent = `Loaded: ${file.name}`;
            
            startSlider.max = trackDuration;
            endSlider.max = trackDuration;
            startSlider.value = 0;
            endSlider.value = trackDuration;
            updateTimeDisplays();

            toggleControls(true);
            resetSliders();
        });

        function createGrainPlayer() {
            if (player) player.dispose();
            player = new Tone.GrainPlayer({
                url: audioBuffer,
                loop: loopToggle.checked,
                loopStart: parseFloat(startSlider.value),
                loopEnd: parseFloat(endSlider.value),
                playbackRate: parseFloat(tempoSlider.value),
                grainSize: 0.1,
                overlap: 0.05
            });
            player.connect(pitchShift);
        }

        // 2. Play / Stop Controls
        playBtn.addEventListener('click', async () => {
            await Tone.start();
            if (audioBuffer) {
                if (!isPlaying) {
                    createGrainPlayer();
                    const startTime = parseFloat(startSlider.value);
                    player.start(0, startTime);
                    isPlaying = true;
                    playBtn.textContent = "⏸ Pause";
                } else {
                    if (player) player.stop();
                    isPlaying = false;
                    playBtn.textContent = "▶ Play";
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            if (player) {
                player.stop();
                isPlaying = false;
                playBtn.textContent = "▶ Play";
            }
        });

        // 3. Standardized Direct Audio Export (Using Tone.Offline GrainPipeline)
        exportBtn.addEventListener('click', async () => {
            if (!audioBuffer) return;
            exportBtn.disabled = true;
            exportBtn.textContent = "Rendering audio file...";

            try {
                const currentTempo = parseFloat(tempoSlider.value);
                const currentPitch = parseInt(pitchSlider.value);
                const currentReverbWet = parseFloat(reverbSlider.value);
                const currentFilterFreq = parseFloat(filterSlider.value);

                const startTime = loopToggle.checked ? parseFloat(startSlider.value) : 0;
                const duration = loopToggle.checked ? (parseFloat(endSlider.value) - startTime) : trackDuration;
                const renderDuration = (duration / currentTempo) + 1;

                const renderedBuffer = await Tone.Offline(async () => {
                    const offlinePlayer = new Tone.GrainPlayer({
                        url: audioBuffer,
                        playbackRate: currentTempo,
                        grainSize: 0.1,
                        overlap: 0.05
                    });

                    const offlinePitch = new Tone.PitchShift({ pitch: currentPitch, windowSize: 0.1 });
                    const offlineFilter = new Tone.Filter({ frequency: currentFilterFreq, type: "lowpass" });
                    const offlineReverb = new Tone.Freeverb({ roomSize: 0.8, dampening: 3000, wet: currentReverbWet });

                    offlinePlayer.connect(offlinePitch);
                    offlinePitch.connect(offlineFilter);
                    offlineFilter.connect(offlineReverb);
                    offlineReverb.toDestination();

                    offlinePlayer.start(0, startTime);
                }, renderDuration);

                const wavBlob = bufferToWave(renderedBuffer.get(), Math.floor((duration / currentTempo) * audioBuffer.sampleRate));
                const downloadUrl = URL.createObjectURL(wavBlob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = `Audioble_Export_${Date.now()}.wav`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                document.body.removeChild(a);

                exportBtn.textContent = "💾 Export Modified Audio (.wav)";
                exportBtn.disabled = false;
            } catch (err) {
                console.error(err);
                exportBtn.textContent = "Export Failed";
                setTimeout(() => { exportBtn.textContent = "💾 Export Modified Audio (.wav)"; exportBtn.disabled = false; }, 2000);
            }
        });

        // 4. Parameter Controls
        loopToggle.addEventListener('change', (e) => {
            if (player) {
                player.loop = e.target.checked;
                player.loopStart = parseFloat(startSlider.value);
                player.loopEnd = parseFloat(endSlider.value);
            }
        });

        startSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (val >= parseFloat(endSlider.value)) {
                startSlider.value = parseFloat(endSlider.value) - 0.1;
            }
            if (player) player.loopStart = parseFloat(startSlider.value);
            updateTimeDisplays();
        });

        endSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (val <= parseFloat(startSlider.value)) {
                endSlider.value = parseFloat(startSlider.value) + 0.1;
            }
            if (player) player.loopEnd = parseFloat(endSlider.value);
            updateTimeDisplays();
        });

        tempoSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (player) player.playbackRate = val;
            tempoDisplay.textContent = `${val.toFixed(2)}x`;
        });

        pitchSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (pitchShift) pitchShift.pitch = val;
            const sign = val > 0 ? "+" : "";
            pitchDisplay.textContent = `${sign}${val} Semitones`;
        });

        reverbSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (reverb) reverb.wet.value = val;
            reverbDisplay.textContent = `${Math.round(val * 100)}%`;
        });

        filterSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (filter) filter.frequency.value = val;
            filterDisplay.textContent = val >= 20000 ? "Off" : `${val} Hz`;
        });

        function toggleControls(enable) {
            playBtn.disabled = !enable;
            stopBtn.disabled = !enable;
            exportBtn.disabled = !enable;
            loopToggle.disabled = !enable;
            startSlider.disabled = !enable;
            endSlider.disabled = !enable;
            tempoSlider.disabled = !enable;
            pitchSlider.disabled = !enable;
            reverbSlider.disabled = !enable;
            filterSlider.disabled = !enable;
            if (!enable) isPlaying = false;
            playBtn.textContent = "▶ Play";
        }

        function resetSliders() {
            loopToggle.checked = false;
            startSlider.value = 0;
            endSlider.value = trackDuration;
            tempoSlider.value = 1; tempoDisplay.textContent = "1.0x";
            pitchSlider.value = 0; pitchDisplay.textContent = "0 Semitones";
            reverbSlider.value = 0; reverbDisplay.textContent = "0%";
            filterSlider.value = 20000; filterDisplay.textContent = "Off";
            
            if (player) {
                player.playbackRate = 1;
                player.loop = false;
            }
            if (pitchShift) pitchShift.pitch = 0;
            if (reverb) reverb.wet.value = 0;
            if (filter) filter.frequency.value = 20000;
            updateTimeDisplays();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const millis = Math.floor((seconds % 1) * 10);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}.${millis}`;
        }

        function updateTimeDisplays() {
            startDisplay.textContent = formatTime(parseFloat(startSlider.value));
            endDisplay.textContent = formatTime(parseFloat(endSlider.value));
        }

        function bufferToWave(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
                sampleRate = abuffer.sampleRate,
                length = len * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                channels = [],
                sample,
                offset = 0,
                pos = 0;

            setUint32(0x46464952);
            setUint32(length - 8);
            setUint32(0x45564157);

            setUint32(0x20746d66);
            setUint32(16);
            setUint16(1);
            setUint16(numOfChan);
            setUint32(sampleRate);
            setUint32(sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2);
            setUint16(16);

            setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
                    view.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }

            return new Blob([buffer], { type: "audio/wav" });

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        }
    </script>
</body>
</html>
